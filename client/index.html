<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout extend into the notch/home-indicator
         area; the env(safe-area-inset-*) padding in index.css keeps actual
         controls out of it. Without cover, those insets always resolve to 0. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#00ff8c" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Google Fonts for the 5 themes (Phase 10B). Single stylesheet,
         display=swap so themed fonts paint as soon as they arrive. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500;700&family=VT323&family=Inter:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    />
    <title>LumpyLP</title>
    <script>
      // Pre-paint theme application — runs before React hydrates so there's
      // no flash of the default theme on first paint. Reads the most-recently-
      // applied theme from localStorage; the AuthProvider may overwrite this
      // once /api/auth/me resolves with the server-stored value.
      (function () {
        try {
          var t = localStorage.getItem('lumpylp_theme');
          if (t === 'amber' || t === 'mono' || t === 'light' || t === 'highcontrast' || t === 'underground') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) { /* private mode / no storage — fall through to default */ }
      })();
    </script>
  </head>
  <body class="bg-bg text-body font-mono">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
